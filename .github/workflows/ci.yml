name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.12"
          check-latest: true
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/docker-secrets-1password

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.12"
          check-latest: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.12"
          check-latest: true
      - run: go install github.com/zricethezav/gitleaks/v8@v8.30.0
      - run: gitleaks detect --source . --no-git --redact
